short_bio: >- 
  <p>
   Hi, my name is CHENG YE(程烨，程ヨウ). I am now a first year master student at the <a href="https://www.kyoto-u.ac.jp">Kyoto University</a>, where I conduct research 
   in the <a href="https://shudo-lab.org">Data Engineering and Platform Research Group</a>, advised by Prof. <a href="http://www.shudo.net/index-j.html">Kazuyuki Shudo</a>. 
   I received my B.Eng. degree from the <a href="https://www.kansai-u.ac.jp/ja/?stt_lang=ja">Kansai University</a>, 
   advised by Assoc. Prof. <a href="https://www.kansai-u.ac.jp/ordist/staff/data/id015207.html">Adachi Naotoshi</a>.

   </p>
  <p>
   My research interests lie broadly in the Federated Learning and Blockchain.
  </p>

