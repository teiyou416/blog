  short_bio: >-
    <p>
     はじめまして、程ヨウ（CHENG YE，程烨）と申します。現在、<a href="https://www.kyoto-u.ac.jp">京都大学</a>大学院情報学研究科の修士1年生として、
     <a href="http://www.shudo.net/index-j.html">首藤一幸</a>教授の指導のもと、<a href="https://shudo-lab.org">首藤研究室</a>で研究を行っています。
     <a href="https://www.kansai-u.ac.jp/ja/?stt_lang=ja">関西大学</a>にて学士（工学）を取得しました。学部時代の指導教員は
     <a href="https://www.kansai-u.ac.jp/ordist/staff/data/id015207.html">安達直世</a>准教授です。
    </p>
    <p>
     研究分野は主に連合学習（Federated Learning）、ブロックチェーン、AI セキュリティです。
     趣味はクライミング、サッカー、筋トレです。
    </p>
